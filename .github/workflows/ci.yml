name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scoreboard check reads which commit added each case.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: node dist/cli.js --version
      - name: scoreboard is in step with the suite
        run: bun scripts/cases.ts --check
      - name: crash suite
        shell: bash
        run: |
          set -o pipefail
          CRASHTEST_MARKDOWN=1 bun run crashtest | tee crashtest.log
      - name: crash suite summary
        # Runs after a red suite too: the table is the point when something escaped.
        if: always()
        shell: bash
        run: |
          {
            echo "### crash suite on ${{ matrix.os }}"
            echo
            grep -E '^\|' crashtest.log || echo "no table: the suite did not finish"
            echo
            grep -E 'failure modes caught' crashtest.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  # The cgroup net (docs/CGROUP.md) has two strategies. The suite above, as
  # the runner user, exercises the systemd user scope. Root may create a
  # sub-cgroup under the runner's own service cgroup, so running the case
  # under sudo exercises the other strategy on the same hosted runner.
  cgroup-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: where the runner lives
        run: |
          id
          uname -r
          cat /proc/self/cgroup
          ls -ld /sys/fs/cgroup
          systemd-run --user --scope --quiet --collect -- true || true
      - name: cgroup-escape as the runner user
        run: bun run crashtest cgroup-escape
      - name: cgroup-escape as root
        run: sudo -E env "PATH=$PATH" bun run crashtest cgroup-escape
